name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CACHE_VERSION: 1

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{ matrix.otp }} - Elixir ${{ matrix.elixir }}
    env:
      MIX_ENV: "test"
      ELIXIR_VERSION: ${{ matrix.elixir }}
      OTP_VERSION: ${{ matrix.otp }}
    strategy:
      fail-fast: false
      # https://elixir.hexdocs.pm/compatibility-and-deprecations.html
      matrix:
        include:
          - otp: "25"
            elixir: "1.18.4"
          - otp: "26"
            elixir: "1.18.4"
          - otp: "27"
            elixir: "1.18.4"
          - otp: "26"
            elixir: "1.19.4"
          - otp: "27"
            elixir: "1.19.4"
          - otp: "28"
            elixir: "1.19.4"
          - otp: "27"
            elixir: "1.20.4"
          - otp: "28"
            elixir: "1.20.4"
          - otp: "29"
            elixir: "1.20.4"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Install Dependencies
        run: mix deps.get
      - name: Run Tests
        run: mix test
